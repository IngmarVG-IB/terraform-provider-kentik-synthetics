# golangci-lint v2 configuration.
# Reference: https://golangci-lint.run/usage/configuration/
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - dogsled
    - durationcheck
    - errorlint
    - gocritic
    - goprintffuncname
    - gosec
    - makezero
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - predeclared
    - revive
    - testpackage
    - unconvert
    - unparam
    - wastedassign
    - whitespace
  settings:
    errcheck:
      # SDKv2 code relies on d.Get(...).(T); the schema guarantees the type.
      check-type-assertions: false
    errorlint:
      errorf: false
    govet:
      enable-all: true
      disable:
        - fieldalignment # reordering struct fields hurts readability
        - shadow
    nakedret:
      max-func-lines: 5
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    testpackage:
      # Internal tests for unexported helpers (state upgraders, conversions) are allowed.
      skip-regexp: _internal_test\.go
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kentik/terraform-provider-kentik-synthetics

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
